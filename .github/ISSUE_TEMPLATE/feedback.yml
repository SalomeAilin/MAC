name: 问题与建议
description: 提交文档问题、功能建议或其他反馈。
body:
  - type: markdown
    attributes:
      value: |
        MAC 当前处于初始化阶段，尚无可运行代码。
        请提供与反馈相关的信息，不要填写密码、令牌、个人信息或机器私密配置。
  - type: dropdown
    id: category
    attributes:
      label: 反馈类型
      options:
        - 文档问题
        - 功能建议
        - 其他反馈
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 反馈内容
      description: 请说明相关文件或使用场景、当前问题和预期结果。
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 补充信息
      description: 如适用，可提供复现步骤、已尝试的检查或相关链接。
    validations:
      required: false
